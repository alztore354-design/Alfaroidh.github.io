<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Verifikasi Dokumen — AL-FARAIDH</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#021c17;--bg2:#064e3b;--card:rgba(255,255,255,.07);--border:rgba(255,255,255,.18);--text:#f0fdf4;--muted:#bbf7d0;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--row:rgba(255,255,255,.06)}
  @media (prefers-color-scheme: light){:root{--bg:#f0fdf4;--bg2:#d1fae5;--card:#ffffff;--border:#a7f3d0;--text:#052e16;--muted:#14532d;--ok:#047857;--bad:#b91c1c;--warn:#b45309;--row:#ecfdf5}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Poppins','Segoe UI',Arial,sans-serif;color:var(--text);
    background:radial-gradient(900px 500px at 15% 0%,var(--bg2) 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,var(--bg2) 0%,transparent 55%),var(--bg);
    background-attachment:fixed;display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh}
  .wrap{width:100%;max-width:440px}
  .brand{text-align:center;margin-bottom:14px}
  .brand .ar{font-family:'Amiri',serif;font-size:30px;line-height:1.2;color:var(--ok)}
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:26px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.25);text-align:center}
  .badge{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border:3px solid currentColor}
  .badge svg{width:46px;height:46px}
  .state-ok{color:var(--ok)}.state-bad{color:var(--bad)}.state-warn{color:var(--warn)}
  .title{font-size:24px;font-weight:700;line-height:1.2;margin:0 0 6px}
  .lead{font-size:14px;color:var(--muted);margin:0 0 16px}
  dl{margin:0;text-align:left}
  .row{background:var(--row);border-radius:12px;padding:10px 14px;margin-bottom:8px}
  dt{font-size:12px;color:var(--muted);margin:0 0 2px}
  dd{margin:0;font-size:16px;font-weight:600;word-break:break-word;color:var(--text)}
  .reason{background:var(--row);border-left:4px solid var(--bad);border-radius:10px;padding:10px 14px;text-align:left;font-size:14px;margin-top:6px}
  .foot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .foot a,.alt a{color:var(--ok);font-weight:600}
  .alt{font-size:13px;margin-top:12px;color:var(--muted)}
  .spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--ok);border-radius:50%;margin:6px auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><div class="ar">الفرائض</div><div class="sub">AL-FARAIDH &middot; Verifikasi Dokumen</div></div>
  <div class="card" id="result" aria-live="polite">
    <div class="spin" role="status" aria-label="Memeriksa"></div>
    <p class="lead" style="margin:0">Memeriksa keabsahan dokumen...</p>
  </div>
  <p class="foot">Pemeriksaan ini hanya membaca data resmi pada sistem AL-FARAIDH. Dokumen yang sah selalu memiliki nomor dokumen yang tercatat.<br><span id="alt"></span></p>
  <noscript><p class="foot">Halaman ini memerlukan JavaScript.</p></noscript>
</main>
<script>
(function () {
  // ===== PENGATURAN (ubah HANYA bila alamat Web App Apps Script berganti) =====
  // Alamat Web App (…/exec) dari Apps Script: Deploy > Manage deployments. Tanpa tanda tanya dan tanpa /u/N/.
  var API = 'https://script.google.com/macros/s/AKfycbyuKyf5t4UAoYnlv1E5k8SC2-m8XuBwysDSQozU774vb9v-AihP9GKnyKWaHKPN-dSm/exec';
  // ===========================================================================

  var TIMEOUT_MS = 12000;
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var ICON = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6M12 17.5v.5"/></svg>'
  };

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function row(label, value) { return '<div class="row"><dt>' + escapeHtml(label) + '</dt><dd>' + escapeHtml(value) + '</dd></div>'; }

  // Token dari ?token=... (juga cocok dengan tautan lama ?p=verify&token=...). Hanya format UUID yang diterima.
  function ambilToken() {
    var m = /[?&]token=([^&#]*)/.exec(String(location.search || ''));
    var t = m ? decodeURIComponent(m[1]) : '';
    return UUID.test(t) ? t : '';
  }
  function tautanLangsung(token) { return API + '?p=verify&token=' + encodeURIComponent(token); }

  // Murni (tanpa DOM): ubah jawaban server menjadi isi kartu. Semua nilai dari server di-escape.
  function bangunTampilan(data) {
    if (data && data.valid) {
      var riwayat = (data.riwayat && data.riwayat.length)
        ? '<p class="lead" style="margin-top:14px">Dokumen ini adalah revisi. Dokumen sebelumnya sudah digantikan:</p><dl>' +
          data.riwayat.map(function (r) { return row('Versi ' + r.versi + (r.tanggalTerbit ? ' (' + r.tanggalTerbit + ')' : ''), r.alasan || '-'); }).join('') + '</dl>'
        : '';
      return { state: 'ok', title: 'DOKUMEN SAH', lead: 'Dokumen ini terdaftar pada sistem AL-FARAIDH.',
        extra: '<dl>' + row('Nomor dokumen', data.documentNumber) + row('Nama almarhum/ah', data.fullName) + row('Status', data.status) + row('Versi', data.version) + '</dl>' + riwayat };
    }
    if (data && data.superseded) return { state: 'warn', title: 'DOKUMEN TELAH DIGANTIKAN', lead: 'Dokumen ini sudah diganti dengan revisi terbaru. Mohon gunakan dokumen terbaru.', extra: '<div class="reason">' + escapeHtml(data.message) + '</div>' };
    if (data && data.revoked) return { state: 'bad', title: 'DOKUMEN TELAH DICABUT', lead: 'Dokumen ini tidak lagi berlaku.', extra: '<div class="reason">' + escapeHtml(data.message) + '</div>' };
    if (data && data.error) return { state: 'warn', title: 'GAGAL MEMERIKSA', lead: 'Terjadi kesalahan saat memeriksa dokumen. Coba lagi nanti.', extra: '' };
    return { state: 'bad', title: 'DOKUMEN TIDAK DITEMUKAN', lead: escapeHtml((data && data.message) || 'Token tidak cocok dengan dokumen manapun.'), extra: '' };
  }

  function show(v) {
    document.getElementById('result').innerHTML =
      '<div class="badge state-' + v.state + '">' + ICON[v.state] + '</div>' +
      '<h1 class="title state-' + v.state + '">' + v.title + '</h1>' + (v.lead ? '<p class="lead">' + v.lead + '</p>' : '') + (v.extra || '');
  }

  // Cara 1: fetch tanpa kredensial (tidak membawa cookie/akun Google -> tidak ada /u/N/).
  function viaFetch(token, ok, gagal) {
    if (typeof fetch !== 'function') { gagal(); return; }
    var selesai = false, timer = setTimeout(function () { if (!selesai) { selesai = true; gagal(); } }, TIMEOUT_MS);
    fetch(API + '?p=verify_json&token=' + encodeURIComponent(token), { method: 'GET', credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (d) { if (selesai) return; selesai = true; clearTimeout(timer); ok(d); })
      .catch(function () { if (selesai) return; selesai = true; clearTimeout(timer); gagal(); });
  }
  // Cara 2 (cadangan bila peramban memblokir fetch lintas-situs): JSONP.
  function viaJsonp(token, ok, gagal) {
    var nama = '__vf' + String(Date.now()), s = document.createElement('script'), selesai = false, timer;
    function akhiri() {
      if (selesai) return false;
      selesai = true; clearTimeout(timer);
      try { delete window[nama]; } catch (e) { window[nama] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      return true;
    }
    timer = setTimeout(function () { if (akhiri()) gagal(); }, TIMEOUT_MS);
    window[nama] = function (d) { if (akhiri()) ok(d); };
    s.onerror = function () { if (akhiri()) gagal(); };
    s.src = API + '?p=verify_json&token=' + encodeURIComponent(token) + '&callback=' + nama;
    document.head.appendChild(s);
  }

  function mulai() {
    var token = ambilToken();
    if (!token) { show({ state: 'bad', title: 'TOKEN TIDAK VALID', lead: 'Tautan verifikasi tidak lengkap atau salah format.', extra: '' }); return; }
    var alt = document.getElementById('alt');
    if (alt) alt.innerHTML = 'Tidak tampil? <a href="' + escapeHtml(tautanLangsung(token)) + '" rel="noopener noreferrer">Buka lewat halaman Google</a>';
    viaFetch(token, function (d) { show(bangunTampilan(d)); }, function () {
      viaJsonp(token, function (d) { show(bangunTampilan(d)); }, function () {
        show({ state: 'warn', title: 'GAGAL MEMERIKSA', lead: 'Tidak dapat menghubungi sistem saat ini. Periksa koneksi, lalu coba lagi.',
          extra: '<p class="alt"><a href="' + escapeHtml(tautanLangsung(token)) + '" rel="noopener noreferrer">Buka lewat halaman Google</a></p>' });
      });
    });
  }

  window.__verifikasiFaraidh = { bangunTampilan: bangunTampilan, ambilToken: ambilToken, escapeHtml: escapeHtml };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai); else mulai();
})();
</script>
</body>
</html>
